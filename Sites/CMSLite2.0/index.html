<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <title>PHPDEV</title>
</head>
<body>
    <!--  -->
    <!-- Модальные окна -->
    <div id="formModal" class="modal">
        <div class="modal-content">
            <h2 class="modal-title" id="formModalTitle"></h2>
            <div id="formFields">
            </div>
            <div id="formModalActions" class="modal-actions">
            </div>
        </div>
    </div>
    <div id="confirmModal" class="modal">
        <div class="modal-content">
            <h2 class="modal-title">Подтверждение</h2>
            <p class="confirmation-text">Вы уверены что хотите удалить <span id="data_confirmBeforeDelete"></span>?</p>
            <div class="modal-actions">
                <button class="modal-btn modal-btn-secondary" onclick="app.modal.closeConfirmModal()">Нет</button>
                <button class="modal-btn modal-btn-danger" onclick="app.modal.confirmDelete()">Да</button>
            </div>
        </div>
    </div>
    <!-- Модальные окна -->
    <!--  -->

    <section>
        <div class="buttons-container">
            <button class="btn btn-create" onclick="app.modal.openFormModal('create')">Создать</button>
            <button class="btn btn-edit" onclick="app.modal.openFormModal('edit')">Редактировать</button>
            <button class="btn btn-delete" onclick="app.modal.openConfirmModal()">Удалить</button>
        </div>

        <div>
            <div class="d-flex">
                <div class="thead w-25">Меню</div>
                <div class="thead w-25">Список</div>
                <div class="thead w-50">Содержимое</div>
            </div>
            <div class="d-flex">
                <div id="menu" class="w-25"></div>
                <div id="list" class="w-25"></div>
                <div id="data" class="w-50"></div>
            </div>
        </div>
    </section>
    <script src="js/app.js"></script>
</body>
</html>
